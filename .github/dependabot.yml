# =====================================================================
# Dependabot — automated dependency updates and security alerts
# Docs: https://docs.github.com/en/code-security/dependabot/dependabot-version-updates
# =====================================================================
version: 2

updates:
  # -------------------------------------------------------------------
  # Python — runtime + dev dependencies
  # -------------------------------------------------------------------
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - python
    commit-message:
      prefix: "deps"
      include: scope
    # Group routine dev-tooling bumps into a single weekly PR to reduce noise
    groups:
      dev-tooling:
        applies-to: version-updates
        patterns:
          - "ruff"
          - "bandit*"
          - "semgrep"
          - "pytest*"
          - "pre-commit"
        update-types:
          - minor
          - patch
      # All security updates land in one PR
      security:
        applies-to: security-updates
        patterns:
          - "*"
    # Major bumps on core libs need manual review — they break things
    ignore:
      - dependency-name: polars
        update-types: ["version-update:semver-major"]
      - dependency-name: pydantic
        update-types: ["version-update:semver-major"]
      - dependency-name: fastapi
        update-types: ["version-update:semver-major"]

  # -------------------------------------------------------------------
  # GitHub Actions — keep workflow `uses:` versions current
  # -------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: "America/Bogota"
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "ci"
      include: scope
    groups:
      gha-actions:
        patterns:
          - "*"

  # -------------------------------------------------------------------
  # Docker — base image updates
  # -------------------------------------------------------------------
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: "America/Bogota"
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "deps(docker)"
      include: scope
