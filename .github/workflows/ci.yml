name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Run ruff check
        run: |
          if [ -d src ] || [ -d tests ]; then
            ruff check .
          else
            echo "::notice::No source yet - skipping ruff"
          fi
