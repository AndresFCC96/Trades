name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Run ruff check
        run: |
          if [ -d src ] || [ -d tests ]; then
            ruff check .
          else
            echo "::notice::No source yet - skipping ruff"
          fi

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest with coverage
        run: |
          if [ ! -d src ] || [ ! -d tests ]; then
            echo "::notice::No src/ or tests/ yet - skipping pytest"
            exit 0
          fi
          pytest --cov=src --cov-report=xml --cov-report=term
      - name: Upload coverage artifact
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  bandit:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install "bandit[toml]>=1.7.10" bandit-sarif-formatter
      - name: Run bandit
        run: |
          if [ -d src ]; then
            bandit -r src/ -c pyproject.toml
          else
            echo "::notice::No src/ yet - skipping bandit"
          fi
      - name: Run bandit (SARIF)
        if: hashFiles('src/**/*.py') != ''
        run: bandit -r src/ -c pyproject.toml -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  semgrep:
    name: Security (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: pip install "semgrep>=1.90"
      - name: Run semgrep
        run: |
          if [ -d src ]; then
            semgrep scan \
              --config=p/python \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --severity=ERROR --severity=WARNING \
              --sarif --output=semgrep.sarif \
              --error \
              || echo "::warning::Semgrep findings detected; check SARIF"
          else
            echo "::notice::No src/ yet - skipping semgrep"
          fi
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile and src presence
        id: check
        run: |
          if [ -f Dockerfile ] && [ -d src ] && [ -d config ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping docker build (Dockerfile or src/ or config/ missing)"
          fi
      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: trade-pipeline:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
