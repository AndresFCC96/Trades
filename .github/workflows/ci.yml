name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  PYTHON_VERSION: "3.12"

permissions:
  contents: read
  security-events: write  # required to upload SARIF

jobs:
  # =================================================================
  # 1) Lint con ruff
  # =================================================================
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install ruff
        run: pip install "ruff>=0.6.0"
      - name: Run ruff check
        run: |
          if [ -d src ] || [ -d tests ]; then
            ruff check .
          else
            echo "::notice::No source yet — skipping ruff"
          fi

  # =================================================================
  # 2) Unit + integration tests con coverage
  # =================================================================
  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run pytest with coverage
        run: |
          set +e
          pytest --cov=src --cov-report=xml --cov-report=term -q
          EXIT=$?
          if [ $EXIT -eq 5 ]; then
            echo "::warning::No tests collected (early commit) — passing"
            exit 0
          fi
          exit $EXIT
      - name: Upload coverage artifact
        if: always() && hashFiles('coverage.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  # =================================================================
  # 3) Bandit — security SAST específico de Python
  # =================================================================
  bandit:
    name: Security (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install bandit
        run: pip install "bandit[toml]>=1.7.10" bandit-sarif-formatter
      - name: Run bandit (human-readable)
        run: |
          if [ -d src ]; then
            bandit -r src/ -c pyproject.toml || true
          else
            echo "::notice::No src/ yet — skipping bandit"
          fi
      - name: Run bandit (SARIF for code-scanning)
        if: hashFiles('src/**/*.py') != ''
        run: bandit -r src/ -c pyproject.toml -f sarif -o bandit.sarif || true
      - name: Upload SARIF
        if: always() && hashFiles('bandit.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit.sarif
          category: bandit

  # =================================================================
  # 4) Semgrep — SAST con OWASP top 10 + security audit
  # =================================================================
  semgrep:
    name: Security (semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install semgrep
        run: pip install "semgrep>=1.90"
      - name: Run semgrep
        run: |
          if [ -d src ]; then
            semgrep scan \
              --config=p/python \
              --config=p/security-audit \
              --config=p/owasp-top-ten \
              --severity=ERROR --severity=WARNING \
              --sarif --output=semgrep.sarif \
              --error \
              || echo "::warning::Semgrep findings detected; check SARIF"
          else
            echo "::notice::No src/ yet — skipping semgrep"
          fi
      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  # =================================================================
  # 5) Docker build smoke test — asegura que el image es construible
  # =================================================================
  docker-build:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    needs: [test]
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: trade-pipeline:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
