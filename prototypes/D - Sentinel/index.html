<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --paper: #f5f3ee;
    --surface: #ffffff;
    --surface-2: #faf8f3;
    --ink: #1a1d24;
    --muted: #6b7280;
    --border: #d4cfc4;
    --border-strong: #a8a193;
  }
  :root[data-theme="dark"] {
    --paper: #0c1220;
    --surface: #141b2a;
    --surface-2: #1a2333;
    --ink: #e8ecf2;
    --muted: #8a95a8;
    --border: #2a3447;
    --border-strong: #4a5570;
  }
  :root {
    --serif: 'Crimson Pro', Georgia, 'Times New Roman', serif;
    --sans: 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--surface-2); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); }
  ::-webkit-scrollbar-thumb:hover { background: #6b7280; }
  input, select, textarea, button { font-family: inherit; }
  input:focus, select:focus { outline: 2px solid #0a2540; outline-offset: -1px; }
  @keyframes pulseD {
    0%, 100% { box-shadow: 0 0 0 0 rgba(21,128,61,0.3); }
    50% { box-shadow: 0 0 0 10px rgba(21,128,61,0); }
  }
</style>
</head>
