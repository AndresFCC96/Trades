<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>Atlas · Trade Pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --paper: #fdfcfa;
    --ink: #0a0a0a;
    --ink-2: #2a2a2a;
    --muted: #8a8682;
    --rule: rgba(10,10,10,0.08);
    --rule-strong: rgba(10,10,10,0.18);
    --chip: rgba(10,10,10,0.05);
    --row-hover: rgba(10,10,10,0.025);
  }
  :root[data-theme="dark"] {
    --paper: #0e0c0a;
    --ink: #f5f3ee;
    --ink-2: #cfcbc2;
    --muted: #8a8682;
    --rule: rgba(245,243,238,0.10);
    --rule-strong: rgba(245,243,238,0.22);
    --chip: rgba(245,243,238,0.05);
    --row-hover: rgba(245,243,238,0.04);
  }
  :root {
    --serif: 'Source Serif 4', Georgia, serif;
    --sans: 'Source Sans 3', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--rule-strong); }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  input, select, textarea, button { font-family: inherit; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }
  @keyframes pulseC {
    0%, 100% { box-shadow: 6px 6px 0 var(--ink), 0 0 0 0 rgba(21,128,61,0.4); }
    50% { box-shadow: 6px 6px 0 var(--ink), 0 0 0 14px rgba(21,128,61,0); }
  }
  kbd { font-family: var(--mono); }
</style>
</head>
<body data-prototype="C" data-default-theme="light">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
