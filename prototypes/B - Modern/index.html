<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<title>Pipely · Modern</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root[data-theme="light"] {
    --bg: #fafafa;
    --bg-soft: #f4f4f5;
    --surface: #ffffff;
    --border: rgba(15, 18, 35, 0.08);
    --border-soft: rgba(15, 18, 35, 0.05);
    --chip: rgba(15, 18, 35, 0.04);
    --chip-strong: rgba(15, 18, 35, 0.10);
    --row-hover: rgba(15, 18, 35, 0.025);
    --fg: #0f1123;
    --fg-2: #2a2d3e;
    --muted: #6b7180;
    --accent: #7c5cff;
    --accent-2: #c084fc;
    --accent-soft: rgba(124, 92, 255, 0.10);
    --ok: #22c55e;
    --warn: #f59e0b;
    --crit: #ef4444;
    --info: #3b82f6;
    --shadow-sm: 0 1px 2px rgba(15,18,35,0.04), 0 1px 1px rgba(15,18,35,0.02);
    --shadow-md: 0 4px 12px rgba(15,18,35,0.06), 0 2px 4px rgba(15,18,35,0.04);
    --shadow-lg: 0 20px 50px rgba(15,18,35,0.14), 0 8px 20px rgba(15,18,35,0.08);
  }
  :root[data-theme="dark"] {
    --bg: #0c0d12;
    --bg-soft: #11131a;
    --surface: #16181f;
    --border: rgba(255,255,255,0.07);
    --border-soft: rgba(255,255,255,0.04);
    --chip: rgba(255,255,255,0.04);
    --chip-strong: rgba(255,255,255,0.10);
    --row-hover: rgba(255,255,255,0.025);
    --fg: #e8eaef;
    --fg-2: #b8bcc8;
    --muted: #7a818f;
    --accent: #9b80ff;
    --accent-2: #c084fc;
    --accent-soft: rgba(155, 128, 255, 0.14);
    --ok: #34d399;
    --warn: #fbbf24;
    --crit: #f87171;
    --info: #60a5fa;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.4);
    --shadow-lg: 0 20px 50px rgba(0,0,0,0.6);
  }

  :root {
    --sans: 'Geist', system-ui, -apple-system, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    font-size: 14px;
    overflow: hidden;
    height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--chip-strong); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); background-clip: padding-box; border: 2px solid transparent; }

  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  @keyframes pulseBigB {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.25); }
    50% { box-shadow: 0 0 0 18px rgba(34,197,94,0); }
  }
  input, select, textarea, button { font-family: inherit; }
  input:focus { outline: none; }
  kbd { font-family: var(--mono); }
</style>
</head>
<body data-prototype="B" data-default-theme="light">
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="mockData.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="shell.jsx"></script>

<script type="text/babel" src="screens2.jsx"></script>
<script type="text/babel" src="screens3.jsx"></script>
<script type="text/babel" src="screens4.jsx"></script>
<script type="text/babel" src="app.jsx"></script>
<script src="../_switcher.js"></script>
</body>
</html>
